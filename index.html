<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f2">
    <title>Presentations</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #172b2b;
            --muted: #687775;
            --paper: #f5f6f2;
            --line: #dce3dd;
            --accent: #c85d3a;
            font-family: "Aptos", "Segoe UI", sans-serif;
            color: var(--ink);
            background: var(--paper);
        }

        * { box-sizing: border-box; }
        body { min-width: 320px; min-height: 100vh; margin: 0; }
        main { width: min(1040px, calc(100% - 48px)); margin: 0 auto; }
        header { display: flex; align-items: center; justify-content: space-between; min-height: 76px; border-bottom: 1px solid var(--line); }
        .wordmark { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
        .count { color: var(--muted); font-size: 13px; }
        .intro { padding: clamp(60px, 12vh, 120px) 0 52px; }
        .eyebrow { margin: 0 0 14px; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        h1 { max-width: 700px; margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(52px, 9vw, 100px); font-weight: 500; letter-spacing: -.04em; line-height: .98; }
        .intro p:last-child { margin: 20px 0 0; color: var(--muted); font-size: 17px; }
        .library { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; padding-bottom: 64px; }
        .presentation-link { display: flex; min-height: 170px; flex-direction: column; justify-content: space-between; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 22px; color: inherit; text-decoration: none; transition: border-color .18s ease, transform .18s ease; }
        .presentation-link:hover, .presentation-link:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
        .folder-name { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
        .card-bottom { display: flex; align-items: end; justify-content: space-between; gap: 18px; }
        .card-bottom strong { font-family: Georgia, "Times New Roman", serif; font-size: 32px; font-weight: 500; }
        .arrow { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 50%; background: var(--ink); color: #fff; font-size: 20px; }
        footer { border-top: 1px solid var(--line); padding: 18px 0 28px; color: var(--muted); font-size: 12px; }
        @media (max-width: 560px) {
            main { width: min(100% - 32px, 1040px); }
            header { min-height: 62px; }
            .intro { padding: 62px 0 36px; }
            .intro p:last-child { font-size: 15px; }
            .presentation-link { min-height: 145px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div class="wordmark">Presentation Library</div>
            <div class="count">02 presentations</div>
        </header>
        <section class="intro" aria-labelledby="page-title">
            <p class="eyebrow">Learning resources</p>
            <h1 id="page-title">Presentations</h1>
            <p>Choose a presentation to open.</p>
        </section>
        <nav class="library" aria-label="Presentations">
            <a class="presentation-link" href="./2tup/index.html" aria-label="Open presentation 2tup">
                <span class="folder-name">2tup</span>
                <span class="card-bottom"><strong>2TUP</strong><span class="arrow" aria-hidden="true">↗</span></span>
            </a>
            <a class="presentation-link" href="./presentation/index.html" aria-label="Open Plateforme de Webinaires presentation">
                <span class="folder-name">presentation</span>
                <span class="card-bottom"><strong>Plateforme de Webinaires</strong><span class="arrow" aria-hidden="true">↗</span></span>
            </a>
        </nav>
        <footer>Presentation folders are listed here by folder name.</footer>
    </main>
</body>
</html>
